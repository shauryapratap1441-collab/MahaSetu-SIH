<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MahaSetu — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #14304C;
    --cream: #F6F3EC;
    --teal: #2E7D6B;
    --teal-dark: #235c4f;
    --gold: #C6923B;
    --ink: #1A1D1F;
    --ink-soft: #5B6470;
    --border: #D8D2C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  header .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header .wordmark {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    font-weight: 600;
  }

  header .tagline {
    font-size: 13px;
    color: #C9D3DC;
  }

  header .start-over {
    background: none;
    border: 1px solid #3E5A75;
    color: #C9D3DC;
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
  }

  header .start-over:hover {
    border-color: #C9D3DC;
    color: white;
  }

  main {
    flex: 1;
    padding: 40px 24px;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 780px;
  }

  /* ---------- Citizen summary strip ---------- */
  .citizen-summary {
    display: flex;
    align-items: center;
    gap: 16px;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 28px;
  }

  .citizen-summary .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    flex-shrink: 0;
  }

  .citizen-summary h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 3px;
  }

  .citizen-summary .meta {
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* Small pill showing how many departments' data is merged in */
  .citizen-summary .badge {
    margin-left: auto;
    background: #EAF3F0;
    color: var(--teal-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .wrap > p.section-note {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  /* ---------- Department data cards ----------
     One card per department the user consented to. Each card has a
     colored left rule instead of a full colored background — a quieter
     way to distinguish sections than the "identical rounded card with
     a different icon" pattern most dashboards default to. */
  .dept-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 32px;
  }

  .dept-card {
    background: white;
    border: 1.5px solid var(--border);
    border-left: 4px solid var(--teal);
    border-radius: 4px;
    padding: 20px 22px;
  }

  .dept-card h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 14px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 24px;
  }

  @media (max-width: 480px) {
    .field-grid { grid-template-columns: 1fr; }
  }

  .field .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }

  .field .value {
    font-size: 14.5px;
    font-weight: 500;
  }

  /* ---------- Empty state ----------
     Shown if someone lands here with no consent recorded — an
     instruction, not a dead end. */
  .empty-state {
    background: white;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    padding: 32px;
    text-align: center;
  }

  .empty-state p {
    color: var(--ink-soft);
    margin: 0 0 16px;
    font-size: 14.5px;
  }

  .empty-state a.button {
    display: inline-block;
    background: var(--teal);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 14.5px;
    padding: 11px 20px;
    border-radius: 6px;
  }

  .empty-state a.button:hover {
    background: var(--teal-dark);
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 16px;
  }
</style>
</head>
<body>

  <header>
    <span class="brand">
      <span class="wordmark">MahaSetu</span>
      <span class="tagline">Government of Maharashtra · Citizen Services</span>
    </span>
    <button class="start-over" id="startOverBtn" type="button">Start over</button>
  </header>

  <main>
    <div class="wrap" id="wrap">
      <!-- Everything below is filled in by JavaScript, based on what
           was saved to localStorage on the previous two screens. -->
    </div>
  </main>

  <footer>MahaSetu Prototype — Smart India Hackathon</footer>

  <script>
    // ---------- Fictional per-department records ----------
    // In the real MahaSetu, this data would come from an API call to
    // each department's backend. For this prototype, we're hardcoding
    // plausible-looking sample records for our two test citizens so
    // the dashboard has something real to display.
    const departmentData = {
      Ramesh: {
        Revenue: {
          title: 'Revenue Department',
          fields: {
            'Survey no.': '142/2A, Pune Taluka',
            '7/12 extract': 'Available',
            'Property tax status': 'Paid — FY 2025–26',
            'Land classification': 'Agricultural'
          }
        },
        Welfare: {
          title: 'Welfare Department',
          fields: {
            'Ration card': 'APL — MH04-118827',
            'Pension status': 'Not enrolled',
            'Scheme enrolments': 'PM-KISAN',
            'Last disbursement': '12 Jun 2026'
          }
        },
        Cooperation: {
          title: 'Cooperation Department',
          fields: {
            'Society membership': 'Vidarbha Farmers Co-op Society',
            'Membership since': '2018',
            'Loan status': 'Active — ₹40,000 outstanding',
            'Last repayment': '03 Aug 2026'
          }
        }
      },
      Anjali: {
        Revenue: {
          title: 'Revenue Department',
          fields: {
            'Survey no.': '87/1B, Nagpur Taluka',
            '7/12 extract': 'Available',
            'Property tax status': 'Due — FY 2025–26',
            'Land classification': 'Residential'
          }
        },
        Welfare: {
          title: 'Welfare Department',
          fields: {
            'Ration card': 'BPL — MH12-045591',
            'Pension status': 'Enrolled — Widow Pension',
            'Scheme enrolments': 'Sanjay Gandhi Niradhar Yojana',
            'Last disbursement': '05 Aug 2026'
          }
        },
        Cooperation: {
          title: 'Cooperation Department',
          fields: {
            'Society membership': 'Nagpur Urban Co-op Bank',
            'Membership since': '2021',
            'Loan status': 'No active loans',
            'Last repayment': '—'
          }
        }
      }
    };

    // ---------- Step 1: read what was decided on the previous screens ----------
    const stored = localStorage.getItem('consent');
    const wrap = document.getElementById('wrap');

    if (!stored) {
      // Nobody has gone through the picker/consent flow yet — or
      // localStorage was cleared. Show an empty state instead of a
      // broken page.
      wrap.innerHTML = `
        <div class="empty-state">
          <p>No consent on record yet. Start from the citizen picker to continue.</p>
          <a class="button" href="citizen-picker.html">Go to citizen picker</a>
        </div>
      `;
    } else {
      const consent = JSON.parse(stored);
      const citizen = consent.citizen;
      const grantedDepts = consent.departments; // e.g. ["Revenue", "Welfare"]
      const records = departmentData[citizen.name] || {};

      // ---------- Step 2: build the citizen summary strip ----------
      const summaryHTML = `
        <div class="citizen-summary">
          <span class="avatar">${citizen.name.charAt(0)}</span>
          <span>
            <h1>${citizen.name}</h1>
            <span class="meta">Citizen ID: ${citizen.id}</span>
          </span>
          <span class="badge">${grantedDepts.length} department${grantedDepts.length === 1 ? '' : 's'} merged</span>
        </div>
      `;

      // ---------- Step 3: build one card per granted department ----------
      // .map() turns each department name into a chunk of HTML, then
      // .join('') glues all those chunks into one string.
      const cardsHTML = grantedDepts.map(deptName => {
        const dept = records[deptName];
        if (!dept) return ''; // safety check, shouldn't normally happen

        const fieldsHTML = Object.entries(dept.fields).map(([label, value]) => `
          <div class="field">
            <div class="label">${label}</div>
            <div class="value">${value}</div>
          </div>
        `).join('');

        return `
          <div class="dept-card">
            <h2>${dept.title}</h2>
            <div class="field-grid">${fieldsHTML}</div>
          </div>
        `;
      }).join('');

      // ---------- Step 4: put it all on the page ----------
      wrap.innerHTML = `
        ${summaryHTML}
        <p class="section-note">Showing records merged from the departments you granted access to.</p>
        <div class="dept-cards">${cardsHTML}</div>
      `;
    }

    // ---------- "Start over" clears everything and returns to screen 1 ----------
    document.getElementById('startOverBtn').addEventListener('click', () => {
      localStorage.removeItem('selectedCitizen');
      localStorage.removeItem('consent');
      window.location.href = 'citizen-picker.html';
    });
  </script>

</body>
</html>
