<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MahaSetu — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #14304C;
    --cream: #F6F3EC;
    --teal: #2E7D6B;
    --teal-dark: #235c4f;
    --gold: #C6923B;
    --ink: #1A1D1F;
    --ink-soft: #5B6470;
    --border: #D8D2C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--navy);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  header .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header .wordmark {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    font-weight: 600;
  }

  header .tagline {
    font-size: 13px;
    color: #C9D3DC;
  }

  header .start-over {
    background: none;
    border: 1px solid #3E5A75;
    color: #C9D3DC;
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
  }

  header .start-over:hover {
    border-color: #C9D3DC;
    color: white;
  }

  main {
    flex: 1;
    padding: 40px 24px;
    display: flex;
    justify-content: center;
  }

  .wrap {
    width: 100%;
    max-width: 780px;
  }

  .citizen-summary {
    display: flex;
    align-items: center;
    gap: 16px;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 28px;
  }

  .citizen-summary .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 18px;
    flex-shrink: 0;
  }

  .citizen-summary h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 3px;
  }

  .citizen-summary .meta {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .citizen-summary .badge {
    margin-left: auto;
    background: #EAF3F0;
    color: var(--teal-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .wrap > p.section-note {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .dept-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 32px;
  }

  .dept-card {
    background: white;
    border: 1.5px solid var(--border);
    border-left: 4px solid var(--teal);
    border-radius: 4px;
    padding: 20px 22px;
  }

  .dept-card h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 14px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 24px;
  }

  @media (max-width: 480px) {
    .field-grid { grid-template-columns: 1fr; }
  }

  .field .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }

  .field .value {
    font-size: 14.5px;
    font-weight: 500;
  }

  .empty-state {
    background: white;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    padding: 32px;
    text-align: center;
  }

  .empty-state p {
    color: var(--ink-soft);
    margin: 0 0 16px;
    font-size: 14.5px;
  }

  .empty-state a.button {
    display: inline-block;
    background: var(--teal);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 14.5px;
    padding: 11px 20px;
    border-radius: 6px;
  }

  .empty-state a.button:hover {
    background: var(--teal-dark);
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 16px;
  }
</style>
</head>
<body>

  <header>
    <span class="brand">
      <span class="wordmark">MahaSetu</span>
      <span class="tagline">Government of Maharashtra · Citizen Services</span>
    </span>
    <button class="start-over" id="startOverBtn" type="button">Start over</button>
  </header>

  <main>
    <div class="wrap" id="wrap">
      <!-- Filled in by JavaScript below, using real data from mahasetu-core -->
    </div>
  </main>

  <footer>MahaSetu Prototype — Smart India Hackathon</footer>

  <script>
    // ---------- Step 1: read what was decided on the previous screens ----------
    const stored = localStorage.getItem('consent');
    const wrap = document.getElementById('wrap');

    if (!stored) {
      wrap.innerHTML = `
        <div class="empty-state">
          <p>No consent on record yet. Start from the citizen picker to continue.</p>
          <a class="button" href="citizen-picker.html">Go to citizen picker</a>
        </div>
      `;
    } else {
      const consent = JSON.parse(stored);
      const citizen = consent.citizen;
      const grantedDepts = consent.departments;

      // ---------- Step 2: call the real MahaSetu backend ----------
      fetch(`http://localhost:8080/citizen-profile?id=${citizen.id}`)
        .then(response => response.json())
        .then(data => renderDashboard(citizen, grantedDepts, data))
        .catch(error => {
          wrap.innerHTML = `
            <div class="empty-state">
              <p>Could not reach the MahaSetu backend. Make sure mahasetu-core is running.</p>
              <p style="font-size:12px; margin-top:8px;">${error}</p>
            </div>
          `;
        });
    }

    // ---------- Step 3: render the dashboard using real backend data ----------
    function renderDashboard(citizen, grantedDepts, data) {
      const summaryHTML = `
        <div class="citizen-summary">
          <span class="avatar">${citizen.name.charAt(0)}</span>
          <span>
            <h1>${citizen.name}</h1>
            <span class="meta">Citizen ID: ${citizen.id}</span>
          </span>
          <span class="badge">${grantedDepts.length} department${grantedDepts.length === 1 ? '' : 's'} merged</span>
        </div>
      `;

      // One possible card per department, built from the unified
      // profile fields mahasetu-core returns. Only the departments
      // the user actually checked on the consent screen get shown.
      const allCards = {
        Revenue: `
          <div class="dept-card">
            <h2>Revenue Department</h2>
            <div class="field-grid">
              <div class="field"><div class="label">District</div><div class="value">${data.district}</div></div>
              <div class="field"><div class="label">Land Record ID</div><div class="value">${data.land_record_id}</div></div>
            </div>
          </div>`,
        Welfare: `
          <div class="dept-card">
            <h2>Welfare Department</h2>
            <div class="field-grid">
              <div class="field"><div class="label">Scheme</div><div class="value">${data.welfare_scheme}</div></div>
              <div class="field"><div class="label">Scheme ID</div><div class="value">${data.welfare_scheme_id}</div></div>
            </div>
          </div>`,
        Cooperation: `
          <div class="dept-card">
            <h2>Cooperation Department</h2>
            <div class="field-grid">
              <div class="field"><div class="label">Society</div><div class="value">${data.cooperative_society}</div></div>
              <div class="field"><div class="label">Registration No.</div><div class="value">${data.cooperative_reg_no}</div></div>
            </div>
          </div>`
      };

      const cardsHTML = grantedDepts.map(dept => allCards[dept] || '').join('');

      wrap.innerHTML = `
        ${summaryHTML}
        <p class="section-note">Showing records merged from the departments you granted access to.</p>
        <div class="dept-cards">${cardsHTML}</div>
      `;
    }

    // ---------- "Start over" clears everything and returns to screen 1 ----------
    document.getElementById('startOverBtn').addEventListener('click', () => {
      localStorage.removeItem('selectedCitizen');
      localStorage.removeItem('consent');
      window.location.href = 'citizen-picker.html';
    });
  </script>

</body>
</html>
