<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MahaSetu — Select Citizen</title>

<!-- Two Google Fonts: Newsreader (serif, for the heading) and Inter (sans, for everything else) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ---------- Design tokens ----------
     Keeping colors as CSS variables means if Shaurya wants to
     change the brand color later, it's a one-line edit here,
     not a find-and-replace across the whole file. */
  :root {
    --navy: #14304C;
    --cream: #F6F3EC;
    --teal: #2E7D6B;
    --teal-dark: #235c4f;
    --gold: #C6923B;
    --ink: #1A1D1F;
    --ink-soft: #5B6470;
    --border: #D8D2C4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top header bar ---------- */
  header {
    background: var(--navy);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header .wordmark {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  header .tagline {
    font-size: 13px;
    color: #C9D3DC;
  }

  /* ---------- Main content ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .panel {
    width: 100%;
    max-width: 640px;
  }

  .panel h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 28px;
    margin: 0 0 6px;
  }

  .panel p.helper {
    color: var(--ink-soft);
    margin: 0 0 32px;
    font-size: 15px;
    max-width: 52ch;
  }

  /* ---------- Citizen tiles ----------
     A "tile" is just a styled button. Using a real <button>
     (not a <div>) means keyboard users can Tab to it and press
     Enter/Space to select it — you get that for free. */
  .tiles {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
  }

  @media (max-width: 520px) {
    .tiles { flex-direction: column; }
  }

  .tile {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .tile:hover {
    border-color: var(--teal);
  }

  .tile:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }

  /* When JS adds this class, the tile shows as selected */
  .tile.selected {
    border-color: var(--gold);
    background: #FBF4E6;
  }

  .tile .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
  }

  .tile.selected .avatar {
    background: var(--gold);
  }

  .tile .name {
    font-weight: 600;
    font-size: 16px;
  }

  .tile .id {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  /* ---------- Continue button ----------
     Disabled by default. JS enables it once a citizen is picked. */
  button.continue {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--teal);
    color: white;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
  }

  button.continue:hover:not(:disabled) {
    background: var(--teal-dark);
  }

  button.continue:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 16px;
  }
</style>
</head>
<body>

  <header>
    <span class="wordmark">MahaSetu</span>
    <span class="tagline">Government of Maharashtra · Citizen Services</span>
  </header>

  <main>
    <div class="panel">
      <h1>Whose records are we looking up?</h1>
      <p class="helper">
        Select a citizen to continue. On the next screen, you'll be asked
        to grant access to the departments that hold their data.
      </p>

      <!-- Each tile is a real <button> with a data-citizen attribute.
           We read that attribute in JS instead of hardcoding names
           in the script, so adding a third citizen later just means
           adding a new <button> here. -->
      <div class="tiles">
        <button class="tile" data-citizen="Ramesh" data-id="1234-5678-9012">
          <span class="avatar">R</span>
          <span>
            <span class="name" style="display:block;">Ramesh</span>
            <span class="id">Citizen ID: MH-2291-0143</span>
          </span>
        </button>

        <button class="tile" data-citizen="Anjali" data-id="9876-5432-1098">
          <span class="avatar">A</span>
          <span>
            <span class="name" style="display:block;">Anjali</span>
            <span class="id">Citizen ID: MH-2291-0198</span>
          </span>
        </button>
      </div>

      <button class="continue" id="continueBtn" disabled>Continue</button>
    </div>
  </main>

  <footer>MahaSetu Prototype — Smart India Hackathon</footer>

  <script>
    // ---------- The interaction logic ----------
    // 1. Grab every tile and the continue button once, up front.
    const tiles = document.querySelectorAll('.tile');
    const continueBtn = document.getElementById('continueBtn');

    // This will hold whichever citizen the user picks.
    // In a real app you'd pass this to screen 2 (e.g. via
    // localStorage, a query string, or a shared JS module).
    let selectedCitizen = null;

    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        // Clear "selected" styling off every tile first...
        tiles.forEach(t => t.classList.remove('selected'));
        // ...then apply it to just the one that was clicked.
        tile.classList.add('selected');

        selectedCitizen = {
          name: tile.dataset.citizen,
          id: tile.dataset.id
        };

        // Now that something is selected, the Continue button works.
        continueBtn.disabled = false;
      });
    });

    continueBtn.addEventListener('click', () => {
        localStorage.setItem('selectedCitizen', JSON.stringify(selectedCitizen));
        window.location.href = 'consent.html';
    });
     
  </script>

</body>
</html>
